name: aur-publish

on:
  push:
    paths:
      - "*/PKGBUILD"


jobs:

  makepkg:
    name: makepkg
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v2

      - id: files
        name: files
        uses: jitterbit/get-changed-files@v1
        with:
          format: 'json'

      - name: printsrc
        uses: enkodin/makepkg@dev
        with:
          src: true
          publish: true
          files: ${{ steps.files.outputs.added_modified }}
